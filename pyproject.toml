[project]
name = "intenthq-presentation-generator"
version = "0.1.0"
description = "Autonomous AI agents for generating tailored sales presentations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=0.2.28",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "firecrawl-py>=1.0.0",
    "tavily-python>=0.5.0",
    "python-pptx>=1.0.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "streamlit>=1.39.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]